const mk = (tag, id, style={}) => {
  const e = document.createElement(tag);
  if (id) e.id = id;
  Object.assign(e.style, style);
  return e;
};
const div = (id, style, parent) => {
  const e = mk('div', id, style);
  (parent || world).appendChild(e);
  return e;
};
const css = (e, s) => Object.assign(e.style, s);
const lerp = (a,b,t) => a + (b-a)*t;
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const world = document.getElementById('world');

// Spring shorthand (position 0→1)
const sp  = (t, t0, r=0.4, d=0.86) => clamp(MK.spring(t - t0, r, d));
const spv = (t, t0, r=0.4, d=0.86, from=0, to=1) => lerp(from, to, sp(t,t0,r,d));

// SEEK — FONCTION PURE DU TEMPS
// ═══════════════════════════════════════════════════════════════
window.seek = function(t) {

  // ── FLAG BAR ──────────────────────────────────────────────
  const flagP = sp(t, 0.3, 0.5, 0.88);
  flagBar.style.transform = `translateY(${lerp(20, 0, flagP) * S}px)`;
  flagBar.style.opacity   = String(clamp(flagP * 2));

  // ── HOOK ──────────────────────────────────────────────────
  const hookVisible = t < 1.8;
  hookEl.style.display = hookVisible ? '' : 'none';
  if (hookVisible) {
    // Line 1 : slide depuis gauche — déclenché à t=-0.1 pour que t=0 soit déjà partiellement entré
    const p1in  = sp(t, -0.1, 0.38, 0.85);
    const p1out = MK.tween(t, 1.1, 1.5, 0, 1, MK.ease.inOutCubic);
    const x1    = lerp(-W * 0.2, 0, p1in) - lerp(0, W * 0.2, p1out);
    const op1   = clamp(p1in * 3) * (1 - p1out);
    css($('hL1'), { transform:`translateX(${x1}px)`, opacity:String(op1) });

    // Line 2 : décalée 80 ms
    const p2in  = sp(t, -0.02, 0.38, 0.85);
    const x2    = lerp(-W * 0.2, 0, p2in) - lerp(0, W * 0.2, p1out);
    const op2   = clamp(p2in * 3) * (1 - p1out);
    css($('hL2'), { transform:`translateX(${x2}px)`, opacity:String(op2) });

    // Sub
    const psub = MK.tween(t, 0.2, 0.65, 0, 1, MK.ease.outCubic);
    css($('hSub'), {
      opacity: String(clamp(psub) * (1 - p1out)),
      transform: `translateY(${lerp(16, 0, psub) * S}px)`,
    });
  }

  // ── ITEM CARDS ────────────────────────────────────────────
  ITEMS.forEach((item, i) => {
    const t0  = T_ITEM(i);
    const t1  = t0 + T_ITEM_DUR;
    const vis = t >= t0 - 0.25 && t < t1 + 0.25;
    const el  = itemEls[i];
    el.style.display = vis ? '' : 'none';
    if (!vis) return;

    // Entrée depuis la droite (spring rapide)
    const pIn  = sp(t, t0, 0.32, 0.88);
    // Sortie vers la gauche (rapide, critique)
    const pOut = sp(t, t1 - 0.12, 0.22, 1.0);

    const xIn  = lerp(W * 1.05, 0, pIn);
    const xOut = lerp(0, -W * 0.12, pOut);
    const x    = xIn + xOut;
    const opIn = clamp(pIn * 4);
    const opOut = 1 - clamp(MK.tween(t, t1 - 0.08, t1, 0, 1));

    el.style.transform = `translateX(${x}px)`;
    el.style.opacity   = String(opIn * opOut);

    // SVG : légère mise à l'échelle au spring
    const svgEl = $(`item${i}_svg`);
    if (svgEl) {
      const scl = lerp(0.82, 1.0, sp(t, t0, 0.45, 0.80));
      svgEl.style.transform = `scale(${scl})`;
      svgEl.style.transformOrigin = 'center center';
    }

    // Coche : se dessine à partir de t0+0.35
    const ckPath = $(`ck${i}`);
    if (ckPath) {
      const ckP = clamp(MK.tween(t, t0 + 0.35, t0 + 0.78, 0, 1, MK.ease.outCubic));
      ckPath.style.strokeDashoffset = String(380 * (1 - ckP));
    }

    // Tampon OBLIGATOIRE (item index 2)
    if (item.hasStamp) {
      const stEl = $(`item${i}_stamp`);
      if (stEl) {
        const stP = sp(t, t0 + 0.25, 0.32, 0.72);
        const stScale = clamp(stP);
        stEl.style.transform = `rotate(-11deg) scale(${stScale})`;
        stEl.style.opacity   = String(clamp(stP * 2));
      }
    }
  });

  // ── RECAP ─────────────────────────────────────────────────
  const recapVis = t >= T_RECAP_IN - 0.25 && t < T_CHUTE_IN + 0.15;
  recapEl.style.display = recapVis ? '' : 'none';
  if (recapVis) {
    const pIn  = sp(t, T_RECAP_IN, 0.35, 0.88);
    const pOut = MK.tween(t, T_CHUTE_IN - 0.15, T_CHUTE_IN, 0, 1, MK.ease.inOutCubic);
    recapEl.style.transform = `translateX(${lerp(W * 0.06, 0, pIn)}px)`;
    recapEl.style.opacity   = String(clamp(pIn * 3) * (1 - pOut));

    // Cascade des lignes
    recapRows.forEach((row, i) => {
      const rStart = T_RECAP_IN + 0.05 + i * 0.09;
      const rP = sp(t, rStart, 0.32, 0.88);
      row.style.opacity   = String(clamp(rP * 2));
      row.style.transform = `translateX(${lerp(-28 * S, 0, clamp(rP * 2))}px)`;
    });
  }

  // ── CHUTE ─────────────────────────────────────────────────
  const chuteVis = t >= T_CHUTE_IN - 0.25 && t < T_CTA_IN + 0.1;
  chuteEl.style.display = chuteVis ? '' : 'none';
  if (chuteVis) {
    const pIn  = sp(t, T_CHUTE_IN, 0.45, 0.88);
    const pOut = MK.tween(t, T_CTA_IN - 0.18, T_CTA_IN, 0, 1, MK.ease.inOutCubic);
    // Slide depuis le bas
    const y    = lerp(H * 0.05, 0, pIn) - lerp(0, -H * 0.05, pOut);
    chuteEl.style.transform = `translateY(${y}px)`;
    chuteEl.style.opacity   = String(clamp(pIn * 3) * (1 - pOut));

    // Lines du texte
    const scl1 = lerp(0.88, 1.0, sp(t, T_CHUTE_IN + 0.05, 0.5, 0.85));
    css($('cL1'), { transform:`scale(${scl1})`, transformOrigin:'left center' });
    const scl2 = lerp(0.88, 1.0, sp(t, T_CHUTE_IN + 0.12, 0.5, 0.85));
    css($('cL2'), { transform:`scale(${scl2})`, transformOrigin:'left center' });
    const op3  = clamp(MK.tween(t, T_CHUTE_IN + 0.4, T_CHUTE_IN + 0.8, 0, 1));
    css($('cL3'), { opacity:String(op3) });
  }

  // ── CTA ───────────────────────────────────────────────────
  const ctaVis = t >= T_CTA_IN - 0.25;
  ctaEl.style.display = ctaVis ? '' : 'none';
  if (ctaVis) {
    const pIn  = sp(t, T_CTA_IN, 0.5, 0.88);
    // Slide depuis le bas (comme si la page tourne)
    const y    = lerp(H * 0.04, 0, pIn);
    ctaEl.style.transform = `translateY(${y}px)`;
    ctaEl.style.opacity   = String(clamp(pIn * 3));

    // Arc tracé
    const arcPath  = document.getElementById('arcPath');
    const arcPlane = document.getElementById('arcPlane');
    if (arcPath) {
      const arcStart = T_CTA_IN + 0.5;
      const arcP = MK.tween(t, arcStart, arcStart + 1.4, 0, 1, MK.ease.inOutCubic);
      arcPath.style.strokeDashoffset = String(1220 * (1 - arcP));

      // Avion suit l'arc
      if (arcPlane && arcP > 0) {
        const u  = arcP;
        // Bezier quadratique P0=(80,110) P1=(460,0) P2=(840,110)
        const bx = (1-u)*(1-u)*80  + 2*(1-u)*u*460  + u*u*840;
        const by = (1-u)*(1-u)*110 + 2*(1-u)*u*0    + u*u*110;
        // Tangente
        const tx = 2*((1-u)*(460-80)  + u*(840-460));
        const ty = 2*((1-u)*(0-110)   + u*(110-0));
        const angle = Math.atan2(ty, tx) * 180 / Math.PI;
        arcPlane.setAttribute('transform', `translate(${bx},${by}) rotate(${angle})`);
        arcPlane.style.opacity = String(clamp(arcP * 6));
      }
    }
  }

  // ── Micro-mouvement caméra world (légère dérive) ──────────
  const drift = MK.noise1(t * 0.4, 7) * 3 * S;
  world.style.transform = `translateY(${drift}px)`;
};

  });
}

// ─── BOOT ────────────────────────────────────────────────────
Promise.all([document.fonts.ready]).then(() => {
  window.seek(0);
  window.__ready = true;
});

if (!q.get('render')) {
  const t0 = performance.now();
  (function loop() {
    window.seek(((performance.now() - t0) / 1000) % window.DURATION);
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
