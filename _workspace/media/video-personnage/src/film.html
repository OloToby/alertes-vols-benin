    k1.style.filter = v1 > 40 ? `blur(${Math.min(22, v1 / 70)}px)` : "none";
    put(k2, L(90, W / 2, 80), L(H * .52, H * .64, H * .6) - ex * 0, 1, 1, 0, L(0, .5, 0), 0, `translateX(${-ex * W * 1.1}px)`);
    animWords(k2, t, 8.2, null, 80); k2.style.filter = ex > 0 ? `blur(${ex * 18}px)` : "none";
  } else { hide(greenPanel); hide(k1); hide(k2); }

  /* --- S5 cartes --- */
  if (t >= 9.5 && t < 12.62) {
    for (const id in cards) {
      const c = cards[id], k = cardIn(t, c.order), out = ease.inOutCubic(clamp((t - 12.28 - c.order * .02) / .3));
      put(c.e, c.x, c.y + (1 - k) * 90 - out * 120, clamp((t - 9.55 - c.order * .075) / .15), .9 + .1 * k);
    }
    ticks.forEach((d, i) => {
      const tw = (ticksBox.clientWidth || cards.Bm.w - 72) / NT;
      const at = 9.9 + i * (2.2 / NT), on = clamp((t - at) / .12);
      const hgt = on * (.45 + .55 * Math.abs(Math.sin(i * 1.7))) * 100;
      d.style.left = i * tw + "px"; d.style.width = tw * .55 + "px"; d.style.height = hgt + "%";
      d.style.opacity = .25 + .75 * clamp(1 - (t - at) / 1.2) * on + (i === Math.floor((t - 9.9) / (2.2 / NT)) ? .5 : 0);
    });
  } else Object.values(cards).forEach((c) => hide(c.e));

  /* --- S6 (volet depuis le bas) --- */
  if (t >= 12.3 && t < 14.62) {
    const k = spring(t - 12.3, .5, 1);
    deepPanel2.style.display = ""; deepPanel2.style.transform = `translateY(${(1 - k) * H}px)`;
    deepPanel2.style.borderRadius = `${(1 - k) * 140}px ${(1 - k) * 140}px 0 0`;
    put(s6a, LY.s6[0], LY.s6[1], 1, 1, 0, 0, 0); animWords(s6a, t, 12.6, 14.25);
    put(s6b, LY.s6[0], LY.s6[1] + L(130, 145, 118), 1, 1, 0, 0, 0); animWords(s6b, t, 13.1, 14.25);
  } else { hide(deepPanel2); hide(s6a); hide(s6b); }

  /* --- S7 iris crème + carte de fin --- */
  if (t >= 14.25) {
    const p = ease.inOutExpo(clamp((t - 14.25) / .45)), R = Math.hypot(W, H) * p;
    const oy = LY.end.logo;
    creamIris.style.display = ""; creamIris.style.width = creamIris.style.height = 2 * R + "px";
    creamIris.style.transform = `translate(${W / 2 - R}px,${oy - R}px)`;
    const E = LY.end;
    const kl = spring(t - 14.5, .42, .72), bp = MK.pulse(t, BPM, 7) * (t > 15.5) * .015;
    put(logo, W / 2, E.logo, clamp((t - 14.5) / .1), (.3 + .7 * kl) * (1 + bp), (1 - clamp(kl)) * -25);
    const up = (e, y, t0, s = 1) => { const k = spring(t - t0, .5, .84); put(e, W / 2, y + (1 - k) * 50, clamp((t - t0) / .18), s); };
    up(wordmark, E.word, 14.72); up(tagline, E.tag, 14.9);
    const press = t > 16.35 ? 1 - .06 * Math.exp(-(t - 16.35) * 9) * Math.sin(clamp((t - 16.35) * 8, 0, Math.PI)) : 1;
    up(cta, E.cta, 15.05, press * (1 + bp));
    up(url, E.url, 15.2); up(legal, E.legal, 15.35);
    put(stripeBottom, W / 2, H, 1, 1, 0, .5, 1, `scaleX(${ease.outCubic(clamp((t - 14.6) / .5))})`);
    // curseur qui clique sur le bouton
    const ct = clamp((t - 15.7) / .6), kc = ease.inOutCubic(ct);
    const bw2 = cta.firstChild.offsetWidth / 2;
    const cxp = lerp(W * L(.85, .85, .85), W / 2 + bw2 - 58 * LS, kc), cyp = lerp(H * L(.62, .8, .8), E.cta + 16 * LS, kc) + Math.sin(ct * Math.PI) * -60;
    put(cursor, cxp, cyp, clamp((t - 15.7) / .15) * (1 - clamp((t - 16.9) / .25)), t > 16.35 && t < 16.5 ? .88 : 1, 0, .2, .1);
  } else [creamIris, logo, wordmark, tagline, cta, url, legal, stripeBottom, cursor].forEach(hide);

  /* --- personnage --- */
  cx.clearRect(0, 0, W, H);
  const C = charPose(t);
  if (C) {
    if (C.clip) { cx.save(); const f = C.clip; const k = cardIn(t, f.order); cx.beginPath(); cx.roundRect(f.x - f.w / 2, f.y - f.h / 2 + (1 - k) * 90 - ease.inOutCubic(clamp((t - 12.28) / .3)) * 120, f.w, f.h, 34); cx.clip(); }
    drawChar(cx, C.P);
    if (C.clip) cx.restore();
    ditherChar(C.P, C.ink, C.paper);
    pin(C.P);
  }
  cv.style.zIndex = t >= 12.3 && t < 14.62 ? 50 : t >= 9.5 && t < 12.62 ? 12 : 20;
};

Promise.all([document.fonts.ready, ...["Sora", "Inter"].flatMap((f) => [400, 600, 700].map((w) => document.fonts.load(`${w} 40px ${f}`, "Béninàé€→")))])
  .then(() => { window.seek(0); window.__ready = true; });

if (!q.get("render")) {
  const t0 = performance.now();
  (function loop() { window.seek(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
