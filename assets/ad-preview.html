/* ── EXACT SITE TOPBAR ── */
.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px 0;
}
.wordmark {
  display:flex; align-items:center; gap:10px;
  text-decoration:none;
}
.wordmark-icon {
  width:36px; height:36px;
  background:rgba(255,255,255,0.12);
  border:0.93px solid rgba(255,255,255,0.22);
  border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; line-height:1;
}
.wordmark-label {
  font-family:Sora,sans-serif;
  font-size:15px;
  font-weight:600;
  letter-spacing:0.01em;
  color:rgba(255,255,255,0.9);
}
/* Flag-chip exactement comme le site (grille 2fr 3fr × 2 rows) */
.flag-chip {
  display:grid;
  grid-template-columns:2fr 3fr;
  grid-template-rows:1fr 1fr;
  width:32px; height:22px;
  border-radius:4px;
  overflow:hidden;
  box-shadow:rgba(255,255,255,0.28) 0px 0px 0px 1px;
}
.flag-chip span:nth-child(1) { grid-area:1/1/3; background:#008751; }
.flag-chip span:nth-child(2) { grid-area:1/2; background:#FCD116; }
.flag-chip span:nth-child(3) { grid-area:2/2; background:#E8112D; }

/* ── CONTENT ── */
.content {
  position:absolute; inset:0;
  display:flex; flex-direction:column;
}
.flex1 { flex:1; }
.bottom { padding:0 20px 20px; display:flex; flex-direction:column; gap:12px; }
/* Social proof */
.proof {
  display:inline-flex; align-items:center; gap:6px;
  background:var(--accent); border-radius:30px; padding:5px 13px;
  width:fit-content;
}
.proof-dot { width:6px; height:6px; background:#fff; border-radius:50%; animation:blink 1.6s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.45} }
.proof-text { color:#fff; font-size:11px; font-weight:700; }
/* Headline */
.headline {
  font-family:Sora,sans-serif;
  font-size:23px; font-weight:800; color:#fff;
  line-height:1.22; letter-spacing:-0.4px;
  text-shadow:0 2px 16px rgba(0,0,0,.5);
}
/* Sub */
.sub {
  font-size:12.5px; color:rgba(255,255,255,.78); line-height:1.55;
}
.sub strong { color:#fff; font-weight:600; }
/* CTA */
.cta-block {
  background:rgba(255,255,255,.09);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px; padding:12px 14px;
  display:flex; align-items:center; gap:10px;
}
.cta-info { flex:1; }
.cta-domain { font-size:9px; color:rgba(255,255,255,.45); letter-spacing:.3px; margin-bottom:3px; }
.cta-title { font-family:Sora,sans-serif; font-size:11.5px; font-weight:600; color:#fff; line-height:1.3; }
.cta-btn {
  flex-shrink:0; background:#fff; color:var(--deep);
  font-family:Sora,sans-serif; font-size:11px; font-weight:700;
  padding:9px 14px; border-radius:22px; white-space:nowrap;
}
</style>
