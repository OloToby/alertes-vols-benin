<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Alertes Vols Bénin — Image Open Graph 1200×630
       Pour meta og:image, twitter:image, partage social -->
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Inter:wght@400;500&amp;display=swap');</style>
  </defs>

  <!-- Fond deep -->
  <rect width="1200" height="630" fill="#1B2B3C"/>

  <!-- Lueur verte subtile en haut à gauche -->
  <ellipse cx="200" cy="120" rx="400" ry="300" fill="#008751" opacity="0.06"/>

  <!-- Lueur jaune subtile en haut à droite -->
  <ellipse cx="1000" cy="80" rx="300" ry="200" fill="#FCD116" opacity="0.03"/>

  <!-- Logo icône -->
  <rect x="538" y="100" width="56" height="56" rx="12" fill="#008751"/>
  <g transform="translate(566, 126)">
    <path d="
      M 0,-18
      C 1.3,-17 2.2,-15.5 2.2,-13
      L 2.2,-5.5
      L 18,-2.5
      L 18,1.2
      L 2.2,3.6
      L 2.2,11
      L 8.5,15.3
      L 8.5,17.8
      L 0,13.8
      L -8.5,17.8
      L -8.5,15.3
      L -2.2,11
      L -2.2,3.6
      L -18,1.2
      L -18,-2.5
      L -2.2,-5.5
      L -2.2,-13
      C -2.2,-15.5 -1.3,-17 0,-18
      Z
    " fill="white" fill-opacity="0.95"/>
  </g>

  <!-- Wordmark -->
  <text x="606" y="136" font-family="'Sora', 'Poppins', system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.90)" letter-spacing="0.01em">Alertes Vols Bénin</text>

  <!-- Titre principal -->
  <text x="600" y="280" font-family="'Sora', 'Poppins', system-ui, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">
    <tspan x="600" dy="0">Soyez prévenu dès que les vols</tspan>
    <tspan x="600" dy="62">Paris-Cotonou s'ouvrent.</tspan>
  </text>

  <!-- Sous-titre -->
  <text x="600" y="400" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.65)" text-anchor="middle" letter-spacing="0">Les places partent en quelques minutes. Inscrivez-vous pour être prévenu en premier.</text>

  <!-- Pilule CTA visuelle -->
  <rect x="478" y="444" width="244" height="50" rx="12" fill="#008751"/>
  <text x="600" y="476" font-family="'Inter', system-ui, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">S'inscrire maintenant</text>

  <!-- URL discrète -->
  <text x="600" y="550" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="0.04em">alertes-vols-benin.workers.dev</text>

  <!-- Barre tricolore 1:2:1 en bas -->
  <rect x="0" y="620" width="300" height="10" fill="#008751"/>
  <rect x="300" y="620" width="600" height="10" fill="#FCD116"/>
  <rect x="900" y="620" width="300" height="10" fill="#E8112D"/>
</svg>
